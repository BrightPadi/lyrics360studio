<html>
<head>
    <title>LYRICS360 STUDIO - Sign Up</title>
</head>

<body>

    <header>
        <h1>LYRICS360 STUDIO</h1>
        <p>Lyrics You Can Feel 🎵</p>
    </header>

    <nav>
        <a href="INDEX.HTML">Home</a>
        <a href="MUSIC.HTML">Music</a>
        <a href="SIGNUP.HTML">Sign Up</a>
        <a href="SIGNIN.HTML">Sign In</a>
    </nav>

    <main>

        <div class="signup-box">

            <h2>Create Your Account</h2>
            <p>Join LYRICS360 STUDIO today!</p>

            <form>

                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>

                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" placeholder="Create a password" required>

                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password" required>

                <button type="submit">Sign Up</button>

            </form>

            <p>Already have an account?
                <a href="SIGNIN.HTML">Sign In</a>
            </p>

        </div>

    </main>

    <footer>
        <p>© 2026 LYRICS360 STUDIO</p>
    </footer>

    <style>
        body {
            background: #020817;
            color: white;
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        header {
            color: #00baff;
            padding: 15px;
        }

        nav {
            background: #07162b;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 8px;
        }

        nav a:hover {
            color: #00baff;
        }

        .signup-box {
            background: #07162b;
            border: 1px solid #123e64;
            width: 300px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
        }

        h2 {
            color: #00baff;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #123e64;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #00baff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #008dcc;
        }

        .signup-box a {
            color: #00baff;
        }

        footer {
            background: #07162b;
            padding: 10px;
        }
    </style>

</body>
</html>
